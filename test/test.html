<!DOCTYPE html>
<html>
  <head>
    <title>page 1</title>     
    <style>
     /* Dropdown button */
      .dropbtn {
        background-color: DimGray;
        color: white;
        padding: 15px;
        font-size: 16px;
        border: none;
        cursor: pointer;
      }
      /* dropdown button on hover and focus*/
      .dropbtn:hover, .dropbtn:focus {
        background-color: lightblue;
      }
      /* container <div> needed to position the dropdown content */
        .dropdown {
          position: relative;
          display: inline-block
        }
        /* dropdown content (hidden by default) */
        .dropdown-content {
          display: none;
          position: absolute;
          background-color: lightgray;
          min-width: 160px;
          box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
          z-index: 1;
        }
        /* change color of dropdown links on hover */
        .dropdown-content a:hover {background-color: #ddd;}
        /* show the dropdown menu */
        .show {display:block !important;}
      </style>
      <style>      
        ul{
          list-style-type: none;
          margin: 0;
          padding: 0;
          overflow: hidden;
          background-color: #333
        }
        ul li { float: left;}
        ul li a {
          display: block;
          color: white;
          text-align: center;
          padding: 14px 16px;
          text-decoration: none;
        }
        ul li a:hover {
          background-color: #111
        }
      </style>
  </head>
  <body>
      <ul>
        <li><a   <a href="test2.html">Next page</a></li>
      </ul>
      <h1>This is a website</h1>
      <p>This is a picture</p>
      <div class = "container" style = "text-align: center; margin-top: 5cm;">
        <img id = "img1" src="closeup-scarlet-macaw-from-side-view-scarlet-macaw-closeup-head_488145-3540.avif" onclick="enlargeImg()">
      </div> 
      <script>
        img = document.getElementById("img1")

        let imageIsBig = false;
        function enlargeImg() {
          if (imageIsBig) {
            img.style.transform = "scale(0.66)";
            img.style.transition = "transform 0.25s ease";
            imageIsBig = false;
          } else {
            img.style.transform = "scale(1.5)";
            img.style.transition = "transform 0.25s ease";
            imageIsBig = true;
          }
        }
      </script>
      <button id = "mybutton">Click me</button>
      <h2 id= "mytext">click the button to change the text</h2>
      <script>
        const button = document.getElementById("mybutton");
        const text = document.getElementById("mytext");
        button.addEventListener("click", function() {
          text.innerText = "the text has been changed by java script";
        });
      </script>

      <div class="dropdown">
        <button onclick= "myFunction()" class="dropbtn"> Dropdown</button>
        <div id="myDropdown" class="dropdown-content">
          <a href="test2.html">go to next page</a>
        </div>
      </div>
      <script>
        function myFunction() {
          document.getElementById("myDropdown").classList.toggle("show");
        }
        // close dropdown menu
        window.onclick = function(event) {
          if (!event.target.matches('.dropbtn')) {
            var dropdowns = document.getElementsByClassName("dropdown-content");
            var i;
            for (i = 0; i > dropdowns.length; i++) {
              var openDropdown = dropdowns[i];
              if (openDropdown.classlist.contains("show")) {
                openDropdown.classlist.remove("show");
              } 
            }
          }
        }
      </script>

    </body> 
</html>
